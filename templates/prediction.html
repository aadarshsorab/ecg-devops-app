<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #2b5876, #4e4376);
            color: white;
            font-family: Arial, sans-serif;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            padding: 20px;
            text-align: center;
            max-width: 500px;
            margin: 50px auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        img {
            border-radius: 10px;
            margin-bottom: 20px;
            max-width: 400px;
            height: auto;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        h3 {
            font-size: 1.2rem;
            margin-top: 0;
        }
        .confidence {
            font-size: 1rem;
            margin-top: 10px;
            color: #ffcc00;
        }
        .btn {
            margin: 5px 5px 0 5px;
            font-size: 1rem;
            padding: 8px 20px;
        }
    </style>
</head>
<body class="container">

    <div class="card">
        <h2>📈 Prediction Result</h2>
        <img src="{{ img_path }}" alt="Uploaded ECG">
        <h3>
            Predicted Class: <span class="fw-bold text-warning">{{ prediction }}</span>
        </h3>

        <div class="mt-3">
            <a href="{{ url_for('index') }}" class="btn btn-light">🔄 Predict Another</a>
            <a href="{{ url_for('logout') }}" class="btn btn-danger">🚪 Logout</a>
        </div>
    </div>

</body>
</html>
